<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Reminder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:390px;background:#fff;color:#212529;
     font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;}

/* ── section header ── */
.sec-hd{display:flex;align-items:center;gap:9px;padding:13px 15px 11px;cursor:pointer;
        user-select:none;}
.sec-hd .car{font-size:13px;color:#495057;transition:transform .18s;}
.sec-hd.closed .car{transform:rotate(-90deg);}
.sec-hd h2{font-size:16px;font-weight:500;color:#212529;}

/* ── form card ── */
.card{margin:0 15px 13px;background:#f1f3f5;border-radius:7px;padding:15px 14px 13px;}
.card.hide{display:none;}
.fr{display:flex;align-items:center;gap:11px;margin-bottom:11px;}
.fr label{width:38px;font-size:14px;font-weight:700;color:#212529;flex-shrink:0;}
.fr label i{color:#e03131;font-style:normal;}
.fr input{flex:1;min-width:0;border:1px solid #ced4da;border-radius:5px;
          padding:8px 11px;font-size:13.5px;font-family:inherit;color:#212529;outline:none;background:#fff;}
.fr input::placeholder{color:#adb5bd;}
.fr input:focus{border-color:#4dabf7;box-shadow:0 0 0 2px rgba(77,171,247,.2);}

.two{display:flex;gap:14px;margin-bottom:12px;}
.two > div{flex:1;min-width:0;}
.two .lb{font-size:14px;font-weight:700;color:#212529;margin-bottom:5px;}
.sel{width:100%;border:1px solid #ced4da;border-radius:5px;padding:8px 11px;
     font-size:13.5px;font-family:inherit;color:#495057;background:#fff;outline:none;cursor:pointer;}
#prio{background:#adb5bd;color:#fff;border-color:#adb5bd;font-weight:500;}

.btns{display:flex;gap:9px;justify-content:flex-end;}
.btns button{border:0;border-radius:5px;padding:9px 17px;font-size:14px;
             font-weight:500;cursor:pointer;color:#fff;font-family:inherit;}
.b-cur{background:#40c057;} .b-cur:hover{background:#37b24d;}
.b-add{background:#4dabf7;} .b-add:hover{background:#339af0;}
.b-clr{background:#495057;} .b-clr:hover{background:#343a40;}

/* ── priority filter bar ── */
.pbar{display:flex;align-items:center;gap:8px;padding:0 15px 11px;}
.pbar > span{font-size:14px;font-weight:500;color:#212529;}
.dots{display:flex;gap:5px;}
.dot{width:17px;height:17px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.12s;}
.dot.on{border-color:#1971c2;}
.d-none{background:#fff;border:2px solid #868e96;}
.d-none.on{border-color:#1971c2;}
.d-grey{background:#adb5bd;} .d-green{background:#40c057;}
.d-orange{background:#fd7e14;} .d-red{background:#fa5252;}
.pbar a{margin-left:auto;font-size:13.5px;color:#e03131;text-decoration:underline;cursor:pointer;}

/* ── list ── */
.list{border-top:1px solid #e9ecef;max-height:250px;overflow-y:auto;}
.row{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid #f1f3f5;}
.row:last-child{border-bottom:0;}
.fav{width:20px;height:20px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;
     justify-content:center;font-size:11px;font-weight:800;color:#fff;}
.nm{flex:1;min-width:0;font-size:13.5px;color:#212529;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pd{width:15px;height:15px;border-radius:50%;flex-shrink:0;}
.ic{flex-shrink:0;cursor:pointer;font-size:14px;line-height:1;padding:2px;}
.ic.al{color:#495057;} .ic.ed{color:#1971c2;} .ic.dl{color:#e03131;font-weight:700;}
.ic:hover{opacity:.65;}

.empty{padding:26px 15px;text-align:center;color:#adb5bd;font-size:13px;}
</style>
</head>
<body>

  <div class="sec-hd" id="secHd">
    <span class="car">⌄</span>
    <h2>Add Site Reminder</h2>
  </div>

  <div class="card" id="card">
    <div class="fr">
      <label>Url<i>*</i></label>
      <input type="text" id="fUrl" placeholder="Enter website url">
    </div>
    <div class="fr">
      <label>Title<i>*</i></label>
      <input type="text" id="fTitle" placeholder="Enter website title">
    </div>
    <div class="two">
      <div>
        <div class="lb">Priority</div>
        <select class="sel" id="prio">
          <option value="none">None</option>
          <option value="grey">Low</option>
          <option value="green">Normal</option>
          <option value="orange">High</option>
          <option value="red">Urgent</option>
        </select>
      </div>
      <div>
        <div class="lb">Remind me</div>
        <select class="sel" id="remind">
          <option value="">None</option>
          <option value="1h">In 1 hour</option>
          <option value="3h">In 3 hours</option>
          <option value="1d">Tomorrow</option>
          <option value="1w">Next week</option>
        </select>
      </div>
    </div>
    <div class="btns">
      <button class="b-cur" id="bCur">Set current</button>
      <button class="b-add" id="bAdd">Add</button>
      <button class="b-clr" id="bClr">Clear</button>
    </div>
  </div>

  <div class="pbar">
    <span>Priority:</span>
    <div class="dots">
      <div class="dot d-none on" data-p="all" title="All"></div>
      <div class="dot d-grey"   data-p="grey"   title="Low"></div>
      <div class="dot d-green"  data-p="green"  title="Normal"></div>
      <div class="dot d-orange" data-p="orange" title="High"></div>
      <div class="dot d-red"    data-p="red"    title="Urgent"></div>
    </div>
    <a id="clearAll">Clear all</a>
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty" style="display:none">No site reminders yet.</div>

<script src="reminder.js"></script>
</body>
</html>
